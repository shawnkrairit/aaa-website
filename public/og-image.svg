<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Ink background -->
  <rect width="1200" height="630" fill="#0A1628"/>

  <!-- Gold radial glow -->
  <defs>
    <radialGradient id="glow" cx="75%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#B89464" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#B89464" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Corner ticks -->
  <g stroke="#B89464" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 50 50 L 50 80 M 50 50 L 80 50"/>
    <path d="M 1150 50 L 1150 80 M 1150 50 L 1120 50"/>
    <path d="M 50 580 L 50 550 M 50 580 L 80 580"/>
    <path d="M 1150 580 L 1150 550 M 1150 580 L 1120 580"/>
  </g>

  <!-- Top register -->
  <text x="80" y="105" font-family="'JetBrains Mono', monospace" font-size="15" fill="#B89464" letter-spacing="4">
    VOL. IX · A UNITY OF PROFICIENCY
  </text>
  <line x1="80" y1="125" x2="1120" y2="125" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Mark + Wordmark -->
  <g transform="translate(80, 180)">
    <path d="M0 70L35 0L70 70H58L35 24L12 70H0Z" fill="#F7F5F0"/>
    <line x1="12" y1="50" x2="58" y2="50" stroke="#B89464" stroke-width="4"/>
  </g>
  <text x="180" y="225" font-family="'Inter Tight', 'Helvetica Neue', sans-serif" font-size="32" font-weight="700" letter-spacing="6" fill="#F7F5F0">
    SEAN ATTORNEYS ALLIANCE
  </text>

  <!-- Headline -->
  <text x="80" y="350" font-family="'Fraunces', Georgia, serif" font-size="78" font-weight="500" fill="#FFFFFF" letter-spacing="-2">
    Your Trusted Legal Network
  </text>
  <text x="80" y="438" font-family="'Fraunces', Georgia, serif" font-size="78" font-weight="500" fill="#FFFFFF" letter-spacing="-2">
    Across ASEAN
  </text>

  <!-- Italic kicker -->
  <text x="80" y="498" font-family="'Fraunces', Georgia, serif" font-size="34" font-style="italic" fill="#B89464">
    — eleven nations, one alliance.
  </text>

  <!-- Bottom register -->
  <line x1="80" y1="540" x2="1120" y2="540" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>
  <text x="80" y="575" font-family="'JetBrains Mono', monospace" font-size="14" fill="#FFFFFF" fill-opacity="0.6" letter-spacing="3.5">
    11 JURISDICTIONS  ·  16 MEMBER FIRMS  ·  500+ ATTORNEYS
  </text>
  <text x="1120" y="575" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="14" fill="#B89464" letter-spacing="3.5">
    EST. MMXVI · BANGKOK
  </text>

  <!-- Pin decorations on right (suggesting the map) -->
  <g opacity="0.85">
    <circle cx="900" cy="250" r="6" fill="#B89464"/>
    <circle cx="900" cy="250" r="18" fill="#B89464" fill-opacity="0.2"/>
    <circle cx="1000" cy="320" r="6" fill="#B89464"/>
    <circle cx="1000" cy="320" r="18" fill="#B89464" fill-opacity="0.2"/>
    <circle cx="950" cy="200" r="6" fill="#B89464"/>
    <circle cx="950" cy="200" r="18" fill="#B89464" fill-opacity="0.2"/>
  </g>
</svg>
